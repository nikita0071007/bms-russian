name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BMS-Russian.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BMS-Russian
          path: BMS-Russian.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BMS-Russian.apk \
            --title "BMS Russian (тест)" \
            --notes "Тестовая сборка. Скачайте BMS-Russian.apk на телефон и установите." \
            --prerelease
