<title>BMS Russian</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: одна колонка шириной с телефон, сверху шапка и переключатель версии, снизу вкладки. Приборный стиль: крупные цифры, шкалы, спокойные нейтрали. Красный экран опасности перекрывает всё. */
:root{
  --bg:#e9eeeb; --surface:#f7faf8; --surface-2:#dfe7e2; --line:#c6d2cb;
  --fg:#13201a; --muted:#566860; --accent:#d9480f; --accent-soft:#fbe3d6; --on-accent:#fff;
  --good:#1b7f4b; --good-soft:#d6efe0; --warn:#a15c00; --warn-soft:#fbebc8; --bad:#b42318; --bad-soft:#fbdad6;
  --cool:#1d6fb8; --warm:#c2410c;
  --alarm:#b3140a; --alarm-fg:#ffffff; --alarm-soft:#ffd9d4; --alarm-btn:#ffffff; --alarm-btn-fg:#7a0d06;
  --f-display:'Unbounded','Onest',system-ui,sans-serif; --f-body:'Onest',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1713; --surface:#18221d; --surface-2:#222f28; --line:#2f3f36;
  --fg:#e6efe9; --muted:#93a79b; --accent:#ff7a3d; --accent-soft:#3a2418; --on-accent:#1a0d05;
  --good:#4ad18a; --good-soft:#12301f; --warn:#f0b43c; --warn-soft:#3a2d0e; --bad:#ff7b6e; --bad-soft:#3d1a16;
  --cool:#6db3f2; --warm:#ff9a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1713; --surface:#18221d; --surface-2:#222f28; --line:#2f3f36;
  --fg:#e6efe9; --muted:#93a79b; --accent:#ff7a3d; --accent-soft:#3a2418; --on-accent:#1a0d05;
  --good:#4ad18a; --good-soft:#12301f; --warn:#f0b43c; --warn-soft:#3a2d0e; --bad:#ff7b6e; --bad-soft:#3d1a16;
  --cool:#6db3f2; --warm:#ff9a63; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:14px;padding-block:16px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:600 15px var(--f-display);letter-spacing:.01em}
.brand small{display:block;font:400 12px var(--f-body);color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:500 13px var(--f-body);padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:9px 12px}
.scen{display:flex;gap:8px;flex-wrap:wrap}
.scen button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--f-body);padding:7px 12px;border-radius:999px;cursor:pointer}
.scen button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.scen button.danger{border-color:var(--bad);color:var(--bad)}
.scen button.danger[aria-pressed="true"]{background:var(--bad);color:var(--bg);border-color:var(--bad)}
main{display:flex;flex-direction:column;gap:14px;flex:1}
.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font:500 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.status{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px}
.status b{display:block;font:600 16px var(--f-display);line-height:1.3;margin-bottom:2px;text-wrap:balance}
.status p{margin:0;font-size:14px}
.status.good{background:var(--good-soft);color:var(--good)} .status.warn{background:var(--warn-soft);color:var(--warn)} .status.bad{background:var(--bad-soft);color:var(--bad)}
.status .dot{width:10px;height:10px;border-radius:50%;background:currentColor;margin-top:7px;flex:none}
.status p,.status b{color:var(--fg)}
.hero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font:600 30px var(--f-display);font-variant-numeric:tabular-nums}
.ring .num span{font-size:12px;color:var(--muted)}
.kv{display:grid;gap:10px;min-width:0}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:13.5px}
.kv div:last-child{border:0;padding:0}
.kv span{color:var(--muted)} .kv b{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.temps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.temps div{background:var(--surface-2);border-radius:10px;padding:10px;text-align:center}
.temps div.hot{background:var(--bad-soft)}
.temps b{display:block;font:500 20px var(--f-mono);font-variant-numeric:tabular-nums}
.temps span{font-size:12px;color:var(--muted)}
.range{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.range b{font:600 34px var(--f-display);font-variant-numeric:tabular-nums}
.range span{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);margin:10px 0 2px}
.hint{font-size:12.5px;color:var(--muted)}

.cell{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cell .track{width:100%;height:92px;background:var(--surface-2);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.cell .fill{width:100%;background:var(--muted);opacity:.75;border-radius:4px 4px 0 0}
.cell.max .fill{background:var(--warm);opacity:1} .cell.min .fill{background:var(--cool);opacity:1}
.cell.low .fill{background:var(--bad);opacity:1}
.cell i{font:normal 500 10px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);letter-spacing:-.04em}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;text-decoration:none;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--surface-2);border-radius:10px;padding:10px}
.stats b{display:block;font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.tip{border-top:1px solid var(--line);padding:12px 0}
.tip:first-of-type{border-top:0;padding-top:0}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip p{margin:0;font-size:14px;color:var(--muted)}
.lock{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13.5px}

.set{display:grid;gap:0}
.set div{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--line)}
.set div:first-child{border-top:0;padding-top:0}
.set b{font-weight:600} .set code{font:500 14px var(--f-mono);align-self:center;grid-row:span 2}
.set p{margin:0;font-size:13px;color:var(--muted)}
.readonly{display:flex;gap:10px;font-size:13.5px;background:var(--warn-soft);border-radius:12px;padding:12px 14px}
.plans{display:grid;gap:10px}
.plan{border:1px solid var(--line);border-radius:12px;padding:14px}
.plan.pro{border-color:var(--accent)}
.plan h3{margin:0 0 6px;font:600 15px var(--f-display)}
.plan ul{margin:0;padding-left:18px;font-size:14px} .plan li{margin:3px 0}
nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);margin-inline:-16px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}

nav button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
details.card{padding:0}
details.card summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font:500 18px var(--f-mono);color:var(--muted)}
details.card[open] summary::after{content:"−"}
details.card .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.badge{font:500 11px var(--f-body);background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px;margin-left:8px}
.badge.free{background:var(--good-soft);color:var(--good)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tg:first-child{border-top:0;padding-top:0}
.tg small{display:block;color:var(--muted);font-size:12.5px}
.tg input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.tg.off{opacity:.55}
.trip{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.trip:first-child{border-top:0;padding-top:0}
.trip code{font:500 13px var(--f-mono);align-self:center;grid-row:span 2;text-align:right}
.trip span{color:var(--muted);font-size:12.5px}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:999px}
.bar i.mid{background:var(--warn)} .bar i.low{background:var(--bad)}
.healthhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.healthhead b{font:600 30px var(--f-display)}
.report{border:1px dashed var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;font-size:14px}
.report div{display:flex;justify-content:space-between;gap:10px}
.report b{font:500 14px var(--f-mono)}
.widget{display:flex;align-items:center;gap:14px;background:var(--surface-2);border-radius:18px;padding:14px 16px;max-width:260px}
.widget b{font:600 30px var(--f-display);font-variant-numeric:tabular-nums}
.widget span{display:block;font-size:12.5px;color:var(--muted)}
.bat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.bat:first-child{border-top:0;padding-top:0}
.bat small{display:block;color:var(--muted);font-size:12.5px}
.pill{font:500 12px var(--f-body);padding:3px 9px;border-radius:999px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.pill.off{background:var(--surface-2);color:var(--muted)}
[hidden]{display:none!important}
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.gate-in{max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
.gate-in h1{font:600 22px/1.25 var(--f-display);margin:0}
.gate-in p{margin:0;color:var(--muted)}
.gate-in input{font:500 18px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.gate-in .cta{padding:13px;font-size:15px}

#cover{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;font-family:var(--f-body);color:#fff}
#cover .band{flex:1;display:flex;flex-direction:column;justify-content:center;padding-inline:max(24px,env(safe-area-inset-left,0px));}
#cover .w{background:#fff;color:#0b1e4a;padding-top:max(20px,env(safe-area-inset-top,0px))}
#cover .b{background:#0039a6;align-items:center}
#cover .r{background:#d52b1e;gap:14px;padding-bottom:max(18px,env(safe-area-inset-bottom,0px));justify-content:space-between;padding-top:22px}
#cover small{font:500 12px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:#4b5b88}
#cover h1{margin:6px 0 0;font:600 clamp(44px,15vw,68px)/.95 var(--f-display);letter-spacing:-.02em;color:#0039a6}
#cover h1 span{display:block;color:#d52b1e}
#cover .tag{font-size:17px;line-height:1.4;max-width:30ch;margin:0}
#cover button{border:0;background:#fff;color:#0039a6;font:600 17px var(--f-body);padding:15px;border-radius:14px;cursor:pointer;width:100%}
#cover button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#cover .by{font-size:13px;opacity:.9;text-align:center;margin:0}
#cover svg{width:min(62%,230px);height:auto}
@media (prefers-reduced-motion:no-preference){#cover .chg{animation:chg 2.4s ease-in-out infinite alternate}@keyframes chg{from{transform:scaleY(.55)}to{transform:scaleY(1)}}}
#cover .chg{transform-origin:50% 100%;transform-box:fill-box}
/* экран опасности */
#alarm{position:fixed;inset:0;z-index:100;background:var(--alarm);color:var(--alarm-fg);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));overflow:auto}
#alarm .in{max-width:460px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#alarm .sign{width:64px;height:64px;border-radius:50%;border:4px solid var(--alarm-fg);display:flex;align-items:center;justify-content:center;font:600 34px var(--f-display)}
#alarm small{font:500 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--alarm-soft)}
#alarm h1{font:600 26px/1.2 var(--f-display);margin:0;text-wrap:balance}
#alarm .act{font:600 22px/1.3 var(--f-body);background:var(--alarm-fg);color:var(--alarm-btn-fg);border-radius:14px;padding:16px}
#alarm p{margin:0;color:var(--alarm-soft)}
#alarm ol{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--alarm-fg)}
#alarm .fire{border-top:1px solid var(--alarm-soft);padding-top:12px;font-size:14px;color:var(--alarm-soft)}
#alarm button{border:2px solid var(--alarm-fg);background:transparent;color:var(--alarm-fg);font:600 15px var(--f-body);padding:13px;border-radius:12px;cursor:pointer}
#alarm button:focus-visible{outline:3px solid var(--alarm-fg);outline-offset:3px}
@media (max-width:380px){.hero{grid-template-columns:1fr;justify-items:center}.kv{width:100%}.cell i{font-size:9px}}
@media (prefers-reduced-motion:no-preference){.ring circle.v{transition:stroke-dasharray .5s ease}.fill{transition:height .4s ease}#alarm .sign{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.1)}}}
</style>

<script>
const BASE=[3.379,3.378,3.379,3.378,3.382,3.379,3.379,3.377,3.385,3.376,3.382,3.382,3.377,3.378,3.383,3.374,3.378,3.379,3.374,3.377];
const SCEN=[
  {id:'now',label:'Сейчас',off:0,I:-4.3,T:[23,26,28],soc:81.5},
  {id:'full',label:'Конец зарядки',off:0.021,I:6.0,T:[24,27,30],soc:98},
  {id:'cold',label:'Мороз',off:0,I:0,T:[2,3,4],soc:81.5},
  {id:'over',label:'Перезаряд',off:0.026,I:6.0,T:[25,28,31],soc:100,danger:1},
  {id:'hot',label:'Перегрев',off:0,I:-18,T:[56,58,71],soc:60,danger:1},
  {id:'drop',label:'Ячейка просела',off:0,I:-4.0,T:[24,27,29],soc:70,drop:{i:15,d:-0.16},danger:1}
];
const LIM={cellOV:3.50,cellUV:2.57,packOV:68.00,packUV:58.00,maxA:90};
const NOM_WH=30*64, RATED_CYCLES=2500, CYCLES=258;
const OK0=(()=>{try{return localStorage.getItem('bms_ok')==='1'}catch(e){return false}})();
let st={ble:{text:'Не подключено',on:false,log:[]},live:null,liveSeen:false,ok:true,limit:85,tab:'home',pro:true,scen:'now',ack:null,whkm:15,perWeek:5,
  n:{low:true,done:true,balance:false,tg:false},r:{low:true,store:true,balance:false}};
const $=s=>document.querySelector(s);
const f=(n,d=1)=>n.toFixed(d).replace('.',',');

function data(){
  let sc,cells;
  if(st.scen==='live'&&st.live){
    sc={id:'live',I:st.live.I,T:st.live.T,soc:st.live.soc};
    cells=st.live.cells.slice();
  }else{
    sc=SCEN.find(s=>s.id===st.scen)||SCEN[0];
    cells=BASE.map(v=>+(v+sc.off).toFixed(3));
    if(sc.drop) cells[sc.drop.i]=+(cells[sc.drop.i]+sc.drop.d).toFixed(3);
  }
  const pack=cells.reduce((a,b)=>a+b,0);
  const mx=Math.max(...cells),mn=Math.min(...cells);
  return {sc,cells,pack,mx,mn,diff:mx-mn,avg:pack/cells.length,iMx:cells.indexOf(mx),iMn:cells.indexOf(mn),P:Math.abs(sc.I)*pack/1000};
}
function danger(d){
  const ch=d.sc.I>0, battT=Math.max(d.sc.T[0],d.sc.T[1]), mos=d.sc.T[2];
  const out=ch?'Выдерните зарядное из розетки':'Остановитесь и выключите батарею';
  const fire='Если пахнет гарью, батарея вздулась, идёт дым или треск: отойдите от неё, не тушите водой на себе и звоните 112.';
  if(d.pack>LIM.packOV && ch) return {t:'Зарядка не остановилась',a:out,
    why:'Напряжение '+f(d.pack,2)+' В выше защиты платы '+f(LIM.packOV,0)+' В. Плата должна была отключить заряд.',

  if(d.diff>=0.15) return {t:'Одна ячейка резко отстала',a:out,

    steps:[ch?'Выдерните зарядное из розетки.':'Остановитесь и выключите батарею.','Не заряжайте и не разряжайте дальше.','Покажите батарею мастеру, дальше ехать нельзя.'],fire};

function verdict(d){

  if(d.pack>=67.8) return {c:'warn',h:'Заряд почти закончен',p:'До отсечки платы '+f(LIM.packOV-d.pack,2)+' В. Скоро зарядка остановится сама, это нормально.'};

function health(d){

}

function eta(d){

}

      ${st.pro?`<div class="range"><b id="lim-out">${st.limit}%</b><span>напомнить отключить зарядное</span></div><input type="range" id="lim" min="60" max="100" step="5" value="${st.limit}" aria-label="Лимит заряда"><p class="hint" style="margin:0">Зарядка не до 100% бережёт ресурс, хотя у LiFePO₄ этот эффект слабее, чем у обычного литий-иона. Для дальней поездки заряжайте до 100%.</p>`:lock('Напоминание отключить зарядное на выбранном проценте.')}</div></details>

      <div class="tip"><b>Заряд (SOC)</b><p>Сколько энергии осталось, в процентах.</p></div><div class="tip"><b>Баланс ячеек</b><p>Выравнивание напряжения между ячейками. Плата делает это в конце зарядки.</p></div><div class="tip"><b>Разброс</b><p>Разница между самой высокой и самой низкой ячейкой. Чем меньше, тем лучше.</p></div><div class="tip"><b>Силовые ключи</b><p>Транзисторы платы, которые пропускают ток. Греются сильнее остальных частей.</p></div><div class="tip"><b>Цикл</b><p>Один полный расход и набор заряда, например два раза по 50%.</p></div></div></details>
    <details class="card" data-id="charges" ${keep('charges')}><summary><span>Журнал зарядок</span></summary><div class="body">
      ${[['Вчера, 22:10','25% → 100% · ≈5 А','остановила плата на 68,0 В, зарядное выше 68 В'],['Пн, 19:30','40% → 100% · ≈5 А','остановила плата на 68,0 В, зарядное выше 68 В'],['Вс, 09:05','60% → 100% · ≈5 А','остановила плата на 68,0 В, зарядное выше 68 В']].map(t=>`<div class="trip"><b>${t[0]}</b><code>${t[1]}</code><span>${t[2]}</span></div>`).join('')}
      <p class="hint" style="margin:0">Примеры. Приложение само записывает каждую зарядку при подключении: напряжение, ток, температуру и на чём остановился заряд. Вручную ничего вводить не нужно.</p>${st.pro?'<button class="cta" id="exp" style="align-self:flex-start">'+(st.showCsv?'Скрыть таблицу':'Показать таблицу для копирования')+'</button>'+(st.showCsv?'<textarea readonly rows="5" aria-label="Журнал зарядок" style="width:100%;font:12px var(--f-mono);background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px">Дата;Было, %;Стало, %;Ток, А;Остановка\nВчера 22:10;25;100;5;плата 68,0 В\nПн 19:30;40;100;5;плата 68,0 В\nВс 09:05;60;100;5;плата 68,0 В</textarea>':''):lock('Выгрузка журнала зарядок в таблицу (CSV).')}</div></details>
    <details class="card" data-id="notif" ${keep('notif')}><summary><span>Уведомления</span></summary><div class="body">
      <div class="tg"><span>Тревоги безопасности<small>Красный экран, звук и вибрация. Всегда включены.</small></span><span class="badge free">бесплатно</span></div>
      ${tg('low','Заряд ниже 20%','Предупредить заранее',st.n.low,0,'n')}
      ${tg('done','Зарядка закончена','Можно отключить зарядное',st.n.done,0,'n')}
      ${tg('balance','Пора на балансировку','Если разброс ячеек вырос',st.n.balance,1,'n')}
      ${tg('tg','Telegram, если вы вне зоны Bluetooth','Нужен интернет и бот. Тревоги придут и в чат',st.n.tg,1,'n')}
      <p class="hint" style="margin:0">Приложение видит батарею, пока телефон рядом (около 10 метров) и приложение работает в фоне. Это дополнение к защите платы, а не замена.</p></div></details>
    <details class="card" data-id="rem" ${keep('rem')}><summary><span>Напоминания</span></summary><div class="body">
      ${tg('low','Не разряжать ниже 20%','Мягче к батарее',st.r.low,0,'r')}
      ${tg('store','Проверить заряд при хранении','Раз в месяц, если не ездите',st.r.store,0,'r')}
      ${tg('balance','Зарядить до конца для баланса','Раз в месяц',st.r.balance,1,'r')}</div></details>
    <details class="card" data-id="trips" ${keep('trips')}><summary><span>Журнал поездок<span class="badge">Про</span></span></summary><div class="body">
      ${st.pro?trips.map(t=>`<div class="trip"><b>${t[0]}</b><code>${t[2]}</code><span>${t[1]}</span></div>`).join('')+'<p class="hint" style="margin:0">Примеры. Километры считаем по GPS телефона, батарея их сама не знает.</p>':lock('Каждая поездка: километры, расход заряда и Вт·ч на километр.')}</div></details>
    <details class="card" data-id="report" ${keep('report')}><summary><span>Отчёт для продажи<span class="badge">Про</span></span></summary><div class="body">
      ${st.pro?`<div class="report"><div><span>Батарея</span><b>20S LiFePO₄ 30 А·ч</b></div><div><span>Циклы</span><b>${CYCLES}</b></div><div><span>Ёмкость</span><b>≈${f(h.cap,1)} А·ч</b></div><div><span>Разброс ячеек</span><b>${f(d.diff*1000,0)} мВ</b></div><div><span>Состояние</span><b>${h.grade}</b></div></div><p class="hint" style="margin:0">В приложении сохранится файлом, который можно показать покупателю.</p>`:lock('Одной страницей: циклы, ёмкость, баланс и состояние для покупателя.')}</div></details>
    <details class="card" data-id="bats" ${keep('bats')}><summary><span>Мои батареи<span class="badge">Про</span></span></summary><div class="body">
      <div class="bat"><span>Велосипед<small>20S · 30 А·ч · D018050108BD</small></span><span class="pill">на связи</span></div>
      ${st.pro?`<div class="bat"><span>Запасная батарея<small>Добавьте по Bluetooth</small></span><span class="pill off">+ добавить</span></div>`:lock('Несколько батарей в одном приложении.')}</div></details>
    <details class="card" data-id="widget" ${keep('widget')}><summary><span>Виджет на экран</span></summary><div class="body">
      <div class="widget"><b>${f(d.sc.soc,0)}%</b><div><span>${f(d.pack,1)} В · ${danger(d)?'опасность':'всё хорошо'}</span><span>Батарея, велосипед</span></div></div>
      <p class="hint" style="margin:0">Заряд виден без запуска приложения.</p></div></details>
    <details class="card" data-id="limits" ${keep('limits')}><summary><span>Пороги вашей платы</span></summary><div class="body">
      <div class="readonly"><span>🔒</span><span>Настройки только для чтения. Менять пороги защиты из приложения пока нельзя, чтобы не испортить батарею.</span></div>
      <div class="set">${rows.map(r=>`<div><b>${r[0]}</b><code>${r[1]}</code><p>${r[2]}</p></div>`).join('')}</div></div></details>
    <details class="card" data-id="plans" ${keep('plans')}><summary><span>Версии</span></summary><div class="body"><div class="plans">
      <div class="plan"><h3>Бесплатная</h3><ul><li>Заряд, напряжение, ток, температуры</li><li>Напряжение каждой ячейки</li><li>Тревоги безопасности и красный экран опасности</li><li>Главные советы на русском</li><li>Запас хода</li><li>Автоопределение зарядного и журнал зарядок</li></ul></div>
      <div class="plan pro"><h3>Про</h3><ul><li>Здоровье батареи и оценка износа</li><li>История и графики</li><li>Журнал поездок</li><li>Отчёт для продажи</li><li>Все советы, Telegram-уведомления, напоминания о балансе</li><li>Внутреннее сопротивление и слабая ячейка</li><li>Щадящая зарядка с лимитом</li><li>Таблица журнала зарядок для копирования</li><li>Несколько батарей, свои профили «щадящий 67 В»</li></ul><p class="hint" style="margin:8px 0 0">Пока в тесте всё бесплатно.</p></div></div></div></details>`;
}
function alarm(d){
  const dg=danger(d), el=$('#alarm');
  if(!dg||st.ack===st.scen){el.hidden=true;el.innerHTML='';return}
  el.hidden=false;
  el.innerHTML=`<div class="in"><div class="sign" aria-hidden="true">!</div><small>Опасность</small><h1 id="al-title">${dg.t}</h1>
    <div class="act">${dg.a}</div><p>${dg.why}</p><ol>${dg.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
    <div class="fire">${dg.fire}</div><button id="ack">Я всё отключил(а)</button></div>`;
  const b=$('#ack'); if(b) b.focus();
}
function render(){
  const d=data();
  $('#scen').innerHTML=(st.live?`<button data-s="live" aria-pressed="${st.scen==='live'}">Батарея</button>`:'')+SCEN.map(s=>`<button class="${s.danger?'danger':''}" data-s="${s.id}" aria-pressed="${s.id===st.scen}">${s.label}</button>`).join('');
  home(d);cellsView(d);tipsView(d);more(d);alarm(d);
  ['home','cells','tips','more'].forEach(t=>{$('#p-'+t).hidden=st.tab!==t});
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===st.tab));
  
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='ack'){st.ack=st.scen}
  else if(b.dataset.tab){st.tab=b.dataset.tab}
  else if(b.dataset.s){st.scen=b.dataset.s}
  else if(b.dataset.go){st.tab=b.dataset.go;render();if(b.dataset.open){const dt=document.querySelector('#p-more details[data-id="'+b.dataset.open+'"]');if(dt)dt.open=true}return}
  else if(b.id==='v-free'){st.pro=false}
  else if(b.id==='v-pro'){st.pro=true}
  else if(b.id==='exp'){st.showCsv=!st.showCsv}
  else if(b.dataset.ble){if(window.BmsNative){if(b.dataset.ble==='on')window.BmsNative.connect();else window.BmsNative.disconnect()}return}
  else if(b.dataset.copy){if(window.BmsNative)window.BmsNative.copyText(st.ble.log.join('\n'));return}
  else return;
  render();
});
window.onBle=function(m){
  if(m.type==='state'){st.ble.text=m.text;st.ble.on=!!m.on}
  else if(m.type==='log'){st.ble.log.push(m.line);if(st.ble.log.length>80)st.ble.log.shift()}
  else if(m.type==='data'){
    const T=(m.T||[]).slice(0,3);
    if(!T.length)T.push(25);
    while(T.length<3)T.push(T[T.length-1]);
    st.live={cells:m.cells,T:T,I:m.I,soc:m.soc,vpack:m.vpack,at:Date.now()};
    if(!st.liveSeen){st.liveSeen=true;st.scen='live'}
  }
  const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA/.test(a.tagName))return;
  render();
};
setInterval(()=>{if(st.scen==='live'){const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA/.test(a.tagName)))render()}},5000);
document.getElementById('cover-go').addEventListener('click',()=>{document.getElementById('cover').hidden=true});
document.addEventListener('input',e=>{if(e.target.id==='lim'){st.limit=+e.target.value;$('#lim-out').textContent=st.limit+'%'}});
document.addEventListener('change',e=>{
  const i=e.target.closest('input[type=checkbox][data-grp]');if(!i)return;
  st[i.dataset.grp][i.dataset.k]=i.checked;
});
render();
</script>
